name: Ensomi

options:
  minimumXcodeGenVersion: 2.45.0
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    PRODUCT_NAME: $(TARGET_NAME)
    SWIFT_VERSION: 6.0
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES

fileGroups:
  - README.md
  - AGENTS.md
  - LICENSE
  - docs

packages:
  Sonalign:
    url: https://github.com/ensomi-labs/sonalign
    exactVersion: "0.1.0"
  EnsomiProtocol:
    url: https://github.com/ensomi-labs/protocol.git
    exactVersion: "0.1.0"
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    from: "1.38.0"

targets:
  EnsomiIOS:
    type: application
    supportedDestinations:
      - iOS
    sources:
      - path: Apps/EnsomiIOS
    dependencies:
      - target: EnsomiCore
      - target: EnsomiUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ensomi.ios
        INFOPLIST_KEY_CFBundleDisplayName: Ensomi
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Ensomi uses the microphone to prototype nearby music recognition flows.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO

  EnsomiMac:
    type: application
    supportedDestinations:
      - macOS
    sources:
      - path: Apps/EnsomiMac
    info:
      path: Apps/EnsomiMac/Info.plist
      properties:
        CFBundleDisplayName: Ensomi
        NSMicrophoneUsageDescription: Ensomi uses the microphone to prototype nearby music recognition flows.
        NSAudioCaptureUsageDescription: Ensomi captures system audio to synchronize gameplay with audio playing on this Mac.
    dependencies:
      - target: EnsomiCore
      - target: EnsomiUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ensomi.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO

  EnsomiCore:
    type: framework
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: Sources/EnsomiCore
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: Accelerate.framework
      - package: EnsomiProtocol
      - package: SwiftProtobuf
      - package: Sonalign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ensomi.core
        DEFINES_MODULE: YES

  EnsomiUI:
    type: framework
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: Sources/EnsomiUI
    resources:
      - path: Sources/EnsomiUI/Resources
    dependencies:
      - target: EnsomiCore
      - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ensomi.ui
        DEFINES_MODULE: YES

  EnsomiCoreTests:
    type: bundle.unit-test
    supportedDestinations:
      - macOS
    sources:
      - path: Tests/EnsomiCoreTests
    dependencies:
      - target: EnsomiCore
      - target: EnsomiUI
      - package: EnsomiProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ensomi.core.tests

  EnsomiACRCloudDebugCLI:
    type: tool
    supportedDestinations:
      - macOS
    sources:
      - path: Tools/ACRCloudDebugCLI
    dependencies:
      - target: EnsomiCore
      - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ensomi.acrcloud-debug-cli
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

schemes:
  EnsomiIOS:
    build:
      targets:
        EnsomiIOS: all

  EnsomiMac:
    build:
      targets:
        EnsomiMac: all
    test:
      targets:
        - name: EnsomiCoreTests

  EnsomiACRCloudDebugCLI:
    build:
      targets:
        EnsomiACRCloudDebugCLI: all
