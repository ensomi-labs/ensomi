name: Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          # The package has no dependencies and no lockfile: nothing to install and nothing to cache.
          package-manager-cache: false

      - run: npm pack --dry-run
