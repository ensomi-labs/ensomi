org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official

# The Android module is the only one that needs these; they are inert for the JVM modules.
android.useAndroidX=true
android.nonTransitiveRClass=true

# A repository this network cannot reach should fail, not hang the build for minutes.
systemProp.org.gradle.internal.http.connectionTimeout=20000
systemProp.org.gradle.internal.http.socketTimeout=20000
